# Netlify configuration for Housing Decision Engine
# Deploy: push this entire Project Folder to a GitHub repo,
# then connect it to Netlify. The root of the repo = root of the site.

[build]
  # No build step needed — everything is plain HTML/CSS/JS
  publish = "."
  functions = "netlify/functions"

# Redirect /app/verify-session to the Netlify Function for cleaner URLs (optional)
[[redirects]]
  from = "/api/verify-session"
  to   = "/.netlify/functions/verify-session"
  status = 200

# Cache static assets aggressively, HTML never
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
